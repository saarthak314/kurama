[workspace]
resolver = "2"
members = [
  "crates/kurama-protocol",
  "crates/kurama-core",
  "crates/kurama-adapters",
  "crates/kurama-sdk",
  "crates/kurama",
  "crates/kurama-cli",
]
default-members = ["crates/kurama-cli"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
basic-toml = "0.1.10"
crossterm = { version = "0.29.0", default-features = false }
diffy = { version = "0.5.1", default-features = false, features = ["std"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
lexopt = "0.3.2"
libc = "0.2.180"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "sync", "time", "process", "signal", "io-util", "net", "fs"] }
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
