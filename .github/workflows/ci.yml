name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check release versions and regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_version.py' -v
          python3 scripts/check-release-version.py
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace with all features
        run: cargo test --locked --workspace --all-features
      - name: Test verification runners
        run: python3 scripts/test-verification.py

  tui-pty:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-pty-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-pty-${{ runner.os }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PTY emulator
        id: pty-python
        run: |
          python -m venv .venv-tui
          .venv-tui/bin/python -m pip install pyte==0.8.2
      - name: Build CLI for actual PTY checks
        id: pty-build
        run: cargo build --locked -p kurama-cli
      - name: Check actual PTY with cursor reports
        timeout-minutes: 5
        run: .venv-tui/bin/python scripts/check-tui.py target/debug/kurama tui-artifacts/normal --no-images --check-controls
      - name: Check actual PTY without cursor reports and with resumed todos
        if: ${{ !cancelled() && steps.pty-build.outcome == 'success' && steps.pty-python.outcome == 'success' }}
        timeout-minutes: 5
        run: .venv-tui/bin/python scripts/check-tui.py target/debug/kurama tui-artifacts/no-cpr-todos --no-images --no-cpr --seed-todos
      - name: Upload PTY transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kurama-pty-pr-${{ runner.os }}-${{ github.run_id }}
          path: tui-artifacts/
          if-no-files-found: error

  sdk:
    name: SDK contracts (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sdk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-sdk-${{ runner.os }}-
      - name: Build real runtime and native SDK reference
        run: cargo build --locked -p kurama-cli --bin kurama --example sdk_contract
      - name: Typecheck, check unused code, and test TypeScript
        run: |
          npm --prefix sdk/typescript ci --ignore-scripts
          npm --prefix sdk/typescript test
      - name: Typecheck, lint, and test Python
        run: |
          python -m pip install mypy==2.3.1 ruff==0.12.5
          mypy --strict sdk/python/src
          ruff check sdk/python/src scripts/check-sdk.py scripts/check-sdk-release.py tests/fixtures/sdk/client.py
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - name: Build and install distribution artifacts
        run: |
          mkdir -p sdk-artifacts/typescript sdk-artifacts/python sdk-artifacts/typescript-installed
          npm pack ./sdk/typescript --pack-destination sdk-artifacts/typescript
          python -m pip wheel --no-deps --wheel-dir sdk-artifacts/python ./sdk/python
          python -m pip install --no-deps --target sdk-artifacts/python-installed sdk-artifacts/python/*.whl
          tar -xzf sdk-artifacts/typescript/*.tgz -C sdk-artifacts/typescript-installed
      - name: Exercise installed packages against the real Rust runtime
        run: >-
          python scripts/check-sdk.py target/debug/kurama sdk-artifacts/e2e
          --python-path sdk-artifacts/python-installed
          --typescript-module sdk-artifacts/typescript-installed/package/dist/index.js
      - name: Smoke test packaged binary protocol metadata
        run: |
          cargo build --locked --release -p kurama-cli
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          archive="kurama-$version-${{ matrix.target }}.tar.gz"
          mkdir -p sdk-artifacts/runtime
          tar -czf "sdk-artifacts/runtime/$archive" -C target/release kurama
          (cd sdk-artifacts/runtime && shasum -a 256 "$archive" > "$archive.sha256")
          python scripts/check-sdk-release.py "v$version" --binary target/release/kurama --target ${{ matrix.target }} --directory sdk-artifacts/runtime
      - name: Upload SDK packages and contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kurama-sdk-${{ runner.os }}-${{ github.run_id }}
          path: |
            sdk-artifacts/typescript/*.tgz
            sdk-artifacts/python/*.whl
            sdk-artifacts/e2e/
            sdk-artifacts/runtime/
          if-no-files-found: error
