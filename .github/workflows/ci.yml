name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test libraries
        run: cargo test --locked --workspace --lib
      - name: Test core
        run: cargo test --locked -p kurama-core --tests
      - name: Test adapters
        run: cargo test --locked -p kurama-adapters --all-features --tests
      - name: Test SDK
        run: cargo test --locked -p kurama-sdk --tests
      - name: Test kurama
        run: cargo test --locked -p kurama --tests
      - name: Test CLI
        run: cargo test --locked -p kurama-cli --tests
