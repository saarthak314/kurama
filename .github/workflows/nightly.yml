name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/prompt-budget/target
          key: cargo-nightly-heavy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/prompt-budget/Cargo.lock') }}
          restore-keys: cargo-nightly-heavy-${{ runner.os }}-
      - name: Test all features
        run: cargo test --locked --workspace --all-features
      - name: Check prompt budget
        run: scripts/check-prompt-budget.sh

  tui-compatibility:
    name: Actual PTY (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nightly-tui-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-nightly-tui-${{ runner.os }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned PTY emulator
        id: pty-python
        run: |
          python -m venv .venv-tui
          .venv-tui/bin/python -m pip install pyte==0.8.2
      - name: Build CLI for actual PTY checks
        id: pty-build
        run: cargo build --locked -p kurama-cli
      - name: Check actual PTYs across terminal types with controls
        if: ${{ !cancelled() && steps.pty-build.outcome == 'success' && steps.pty-python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          status=0
          for term in xterm-256color screen-256color vt100; do
            .venv-tui/bin/python scripts/check-tui.py target/debug/kurama "tui-artifacts/$term" --no-images --check-controls --term "$term" || status=1
          done
          exit "$status"
      - name: Check actual PTY without cursor reports and with resumed todos
        if: ${{ !cancelled() && steps.pty-build.outcome == 'success' && steps.pty-python.outcome == 'success' }}
        timeout-minutes: 5
        run: .venv-tui/bin/python scripts/check-tui.py target/debug/kurama tui-artifacts/no-cpr-todos --no-images --no-cpr --seed-todos
      - name: Check torn-tail repair, large-output expansion and collapse, and repeated compaction
        if: ${{ !cancelled() && steps.pty-build.outcome == 'success' && steps.pty-python.outcome == 'success' }}
        timeout-minutes: 5
        run: .venv-tui/bin/python scripts/check-tui.py target/debug/kurama tui-artifacts/torn-tail-large-output --no-images --torn-tail --seed-large-output-mib 8 --check-compaction
      - name: Upload PTY transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kurama-pty-nightly-${{ matrix.runner }}-${{ github.run_id }}
          path: tui-artifacts/
          if-no-files-found: error

  native-builds:
    name: Native build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nightly-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-nightly-${{ matrix.target }}-
      - name: Build native release binary
        run: cargo build --locked --release -p kurama-cli --target ${{ matrix.target }}
      - name: Check stripped size
        run: scripts/check-size.sh target/${{ matrix.target }}/release/kurama

  performance:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.98.0
        run: |
          export RUSTUP_HOME="$RUNNER_TEMP/kurama-rustup"
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nightly-performance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-nightly-performance-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build release binary
        id: cli-build
        run: cargo build --locked --release -p kurama-cli
      - name: Build release control-plane, rendering and adapter benchmarks
        id: harness-build
        run: cargo build --locked --release -p kurama-cli --example control_plane_bench --example tui_bench --example adapter_bench
      - name: Measure startup and idle core process
        if: ${{ !cancelled() && steps.cli-build.outcome == 'success' }}
        run: |
          set +e
          python3 scripts/bench-startup.py target/release/kurama | tee startup.json
          startup_status=${PIPESTATUS[0]}
          python3 scripts/bench-idle.py target/release/kurama | tee idle.json
          idle_status=${PIPESTATUS[0]}
          if (( startup_status != 0 || idle_status != 0 )); then
            exit 1
          fi
      - name: Measure control plane, rendering and adapters sequentially
        if: ${{ !cancelled() && steps.harness-build.outcome == 'success' }}
        timeout-minutes: 12
        run: python scripts/bench-harness.py --bin-dir target/release/examples --output-dir harness-measurements --include-adapters
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kurama-performance-${{ github.run_id }}
          path: |
            startup.json
            idle.json
            harness-measurements/
          if-no-files-found: error
